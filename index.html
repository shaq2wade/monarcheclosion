<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monarch Platform Group - Month-End Checklist</title>
<link rel="icon" href="./favicon.ico?v=17" sizes="any">
<link rel="icon" type="image/png" href="./favicon.png?v=17">
<link rel="shortcut icon" href="./favicon.ico?v=17">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=17">
<link rel="manifest" href="./site.webmanifest?v=17">
<meta name="theme-color" content="#f28421">
<style>html,body{margin:0;width:100%;height:100%;background:#fff8ef;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#fff8ef}</style>
<script>
function txt(r){return r?r.textContent.replace(/\s+/g,' ').trim():''}
function find(doc,n){var rows=doc.querySelectorAll('tbody tr');for(var i=0;i<rows.length;i++)if(txt(rows[i]).indexOf(n)>-1)return rows[i];return null}
function patch(){var f=document.getElementById('dashboard'),d,w;if(!f)return;try{w=f.contentWindow;d=f.contentDocument||w.document}catch(e){return}if(!d||!d.querySelector('tbody tr'))return;if(!d.getElementById('completionCardStyles')){var s=d.createElement('style');s.id='completionCardStyles';s.textContent='.nice{background:rgba(8,8,8,.96)!important;display:grid!important;place-items:center!important}.nice .completion-card-html{width:min(88vw,760px);min-height:min(72vh,520px);border-radius:18px;background:radial-gradient(circle at 28% 28%,rgba(255,255,255,.16),transparent 32%),linear-gradient(135deg,#101010 0%,#292929 58%,#0d0d0d 100%);box-shadow:0 28px 90px rgba(0,0,0,.65);display:grid;place-items:center;text-align:left;padding:clamp(30px,6vw,64px);overflow:hidden;position:relative;animation:completionCardPop 1.32s cubic-bezier(.2,1.1,.25,1) both}.nice .completion-card-html:before{content:"";position:absolute;left:-8%;top:9%;width:62%;height:48%;background:radial-gradient(circle,rgba(255,255,255,.22) 0 2px,transparent 3px);background-size:18px 18px;transform:rotate(-10deg);opacity:.7}.nice .completion-copy{position:relative;z-index:1;text-transform:uppercase;font-weight:900;letter-spacing:0;line-height:.88;text-shadow:0 8px 0 rgba(0,0,0,.32),0 0 30px rgba(255,255,255,.24)}.nice .completion-copy .boom{display:block;color:#fff;font-size:clamp(82px,18vw,190px);font-style:italic}.nice .completion-copy .done{display:block;color:#f28421;font-size:clamp(42px,9vw,100px);margin-top:14px}.nice .completion-copy .slash{display:block;width:min(56vw,430px);height:12px;background:#fff;border-radius:999px;margin-top:22px;transform:skew(-24deg)}@keyframes completionCardPop{0%{transform:scale(.72) rotate(-4deg);opacity:.1}18%{transform:scale(1.04) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}@media (max-width:640px){.nice .completion-card-html{min-height:58vh;border-radius:14px}.nice .completion-copy .slash{height:8px}}';d.head.appendChild(s)}var nice=d.getElementById('nice');if(nice&&!nice.querySelector('.completion-card-html'))nice.innerHTML='<div class="completion-card-html"><div class="completion-copy"><span class="boom">BOOM!</span><span class="done">COMPLETED!</span><span class="slash"></span></div></div>';var bank=find(d,'Bank Recs up to date');if(bank&&bank.children[2])bank.children[2].innerHTML='<span class="resp">Ric<span style="opacity:.5;margin:0 2px">/</span>Linda</span>';var con=find(d,'Consolidated Results collated and circulated');if(con){var b=con.querySelector('.badge'),dt=con.querySelector('.dateTxt');if(b){b.textContent='12';b.classList.remove('neg');b.classList.add('pos')}if(dt)dt.textContent=(w&&typeof w.wd==='function')?w.wd('12'):dt.textContent}var kpi=find(d,'KPI Dashboard Updated'),cast=find(d,'Castaway Update');if(kpi&&cast&&kpi.parentNode===cast.parentNode){var rs=[].slice.call(kpi.parentNode.children);if(rs.indexOf(cast)>rs.indexOf(kpi))kpi.parentNode.insertBefore(cast,kpi)}var br=find(d,'Any Bank Report');if(con&&br&&con.parentNode===br.parentNode){var rr=[].slice.call(br.parentNode.children);if(rr.indexOf(con)!==rr.indexOf(br)-1)br.parentNode.insertBefore(con,br)}}
function boot(){patch();if(!window.patchTimer)window.patchTimer=setInterval(patch,500)}
setTimeout(boot,0);
</script>
</head>
<body>
<iframe id="dashboard" src="./app.html?v=17" title="Monarch Month-End Checklist" onload="boot()"></iframe>
</body>
</html>

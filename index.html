<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monarch Platform Group - Month-End Checklist</title>
<link rel="icon" href="./favicon.ico?v=21" sizes="any">
<link rel="icon" type="image/png" href="./favicon.png?v=21">
<link rel="shortcut icon" href="./favicon.ico?v=21">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=21">
<link rel="manifest" href="./site.webmanifest?v=21">
<meta name="theme-color" content="#f28421">
<style>html,body{margin:0;width:100%;height:100%;background:#fff8ef;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#fff8ef}</style>
<script>
var completionSrc='./andy-completed-hq.webp?v=21';
var publicHolidays={'2026-06-01':true,'2026-07-10':true};
function txt(r){return r?r.textContent.replace(/\s+/g,' ').trim():''}
function find(doc,n){var rows=doc.querySelectorAll('tbody tr');for(var i=0;i<rows.length;i++)if(txt(rows[i]).indexOf(n)>-1)return rows[i];return null}
function iso(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(day<10?'0'+day:day)}
function biz(d){return d.getDay()!=0&&d.getDay()!=6&&!publicHolidays[iso(d)]}
function addWD(date,n){var d=new Date(date),dir=n>=0?1:-1,rem=Math.abs(n);while(rem>0){d.setDate(d.getDate()+dir);if(biz(d))rem--}return d}
function installCalendar(w,d){if(!w||!d||w.__monarchHolidayPatch)return;w.__monarchHolidayPatch=true;w.publicHolidays=publicHolidays;w.wd=function(s){var y=parseInt(d.getElementById('year').value)||new Date().getFullYear(),m=d.getElementById('month').selectedIndex,l;if(d.getElementById('closeDate').value){var p=d.getElementById('closeDate').value.split('-');if(+p[0]==y&&+p[1]==m+1)l=new Date(y,m,+p[2])}if(!l){l=new Date(y,m+1,0);while(!biz(l))l.setDate(l.getDate()-1)}if(s=='5-6'){var d5=addWD(l,5),d6=addWD(l,6);return d5.getDate()+' - '+d6.getDate()+' '+w.MO[d6.getMonth()]}var n=parseInt(s),out=n<=-1?(n==-1?l:addWD(l,n+1)):addWD(l,n);return out.getDate()+' '+w.MO[out.getMonth()]};w.refreshDates=function(){d.querySelectorAll('tbody tr').forEach(function(r){var b=r.querySelector('.badge'),dt=r.querySelector('.dateTxt');if(b&&dt)dt.textContent=w.wd(b.textContent)})}}
function patchDates(w,d){installCalendar(w,d);if(w&&typeof w.refreshDates==='function')w.refreshDates()}
function patch(){var f=document.getElementById('dashboard'),d,w;if(!f)return;try{w=f.contentWindow;d=f.contentDocument||w.document}catch(e){return}if(!d||!d.querySelector('tbody tr'))return;patchDates(w,d);if(!d.getElementById('completionCardStyles')){var s=d.createElement('style');s.id='completionCardStyles';s.textContent='.nice{background:rgba(0,0,0,.94)!important;display:grid!important;place-items:center!important}.nice .completion-card-img{display:block!important;width:auto!important;height:auto!important;max-width:min(88vw,620px)!important;max-height:90vh!important;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.65);object-fit:contain!important;animation:completionCardPop 1.3s cubic-bezier(.2,1.1,.25,1) both}.nice .completion-card-fallback{font-size:min(15vw,120px);font-weight:900;color:white;text-align:center}.nice .completion-card-fallback span{color:#f28421}@keyframes completionCardPop{0%{transform:scale(.82) rotate(-3deg);opacity:.15}18%{transform:scale(1.02) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}';d.head.appendChild(s)}var nice=d.getElementById('nice');if(nice){var img=nice.querySelector('.completion-card-img');if(!img){nice.innerHTML='';img=d.createElement('img');img.className='completion-card-img';img.alt='Boom completed';img.onerror=function(){nice.innerHTML='<div class="completion-card-fallback">BOOM!<br><span>COMPLETED!</span></div>'};nice.appendChild(img)}if(img.getAttribute('src')!==completionSrc)img.setAttribute('src',completionSrc)}var bank=find(d,'Bank Recs up to date');if(bank&&bank.children[2])bank.children[2].innerHTML='<span class="resp">Ric<span style="opacity:.5;margin:0 2px">/</span>Linda</span>';var con=find(d,'Consolidated Results collated and circulated');if(con){var b=con.querySelector('.badge'),dt=con.querySelector('.dateTxt');if(b){b.textContent='12';b.classList.remove('neg');b.classList.add('pos')}if(dt)dt.textContent=(w&&typeof w.wd==='function')?w.wd('12'):dt.textContent}var kpi=find(d,'KPI Dashboard Updated'),cast=find(d,'Castaway Update');if(kpi&&cast&&kpi.parentNode===cast.parentNode){var rs=[].slice.call(kpi.parentNode.children);if(rs.indexOf(cast)>rs.indexOf(kpi))kpi.parentNode.insertBefore(cast,kpi)}var br=find(d,'Any Bank Report');if(con&&br&&con.parentNode===br.parentNode){var rr=[].slice.call(br.parentNode.children);if(rr.indexOf(con)!==rr.indexOf(br)-1)br.parentNode.insertBefore(con,br)}patchDates(w,d)}
function boot(){patch();if(!window.patchTimer)window.patchTimer=setInterval(patch,500)}
setTimeout(boot,0);
</script>
</head>
<body>
<iframe id="dashboard" src="./app.html?v=21" title="Monarch Month-End Checklist" onload="boot()"></iframe>
</body>
</html>
